name: Pre-production Docker

on:
  push:
    branches:
      - pre
  workflow_dispatch:

permissions:
  contents: read
  packages: write

concurrency:
  group: adobe2api-pre-production
  cancel-in-progress: true

env:
  IMAGE_REGISTRY: ghcr.io
  IMAGE_NAMESPACE: btcfoxman
  IMAGE_REPOSITORY: adobe2api
  IMAGE_REF: ghcr.io/btcfoxman/adobe2api

jobs:
  build:
    name: Build and Push Image
    runs-on: ubuntu-latest
    outputs:
      image_tag: ${{ github.sha }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.IMAGE_REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push (attempt 1)
        id: build_push_1
        continue-on-error: true
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          push: true
          tags: |
            ${{ env.IMAGE_REF }}:${{ github.sha }}
            ${{ env.IMAGE_REF }}:latest
          platforms: linux/amd64
          cache-from: type=gha
          cache-to: type=gha,mode=max
          provenance: false
          sbom: false

      - name: Wait before build retry
        if: steps.build_push_1.outcome == 'failure'
        shell: bash
        run: sleep 20

      - name: Build and push (attempt 2)
        id: build_push_2
        if: steps.build_push_1.outcome == 'failure'
        continue-on-error: true
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          push: true
          tags: |
            ${{ env.IMAGE_REF }}:${{ github.sha }}
            ${{ env.IMAGE_REF }}:latest
          platforms: linux/amd64
          cache-from: type=gha
          cache-to: type=gha,mode=max
          provenance: false
          sbom: false

      - name: Wait before final build retry
        if: steps.build_push_1.outcome == 'failure' && steps.build_push_2.outcome == 'failure'
        shell: bash
        run: sleep 45

      - name: Build and push (attempt 3)
        if: steps.build_push_1.outcome == 'failure' && steps.build_push_2.outcome == 'failure'
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          push: true
          tags: |
            ${{ env.IMAGE_REF }}:${{ github.sha }}
            ${{ env.IMAGE_REF }}:latest
          platforms: linux/amd64
          cache-from: type=gha
          cache-to: type=gha,mode=max
          provenance: false
          sbom: false

  deploy:
    name: Pull and Start on 192.168.3.5
    needs: build
    runs-on:
      - self-hosted
      - linux
      - x64
      - adobe2api-pre
    env:
      DEPLOY_DIR: /home/btcfoxman/docker/adobe2api
      IMAGE_TAG: ${{ needs.build.outputs.image_tag }}
    steps:
      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.IMAGE_REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Pull and restart service
        shell: bash
        run: |
          set -euo pipefail

          cd "$DEPLOY_DIR"
          test -f docker-compose.yml

          export IMAGE_REGISTRY="${IMAGE_REGISTRY}"
          export IMAGE_NAMESPACE="${IMAGE_NAMESPACE}"
          export IMAGE_REPOSITORY="${IMAGE_REPOSITORY}"
          export IMAGE_NAME="${IMAGE_REPOSITORY}"
          export IMAGE_TAG="${IMAGE_TAG}"

          docker network inspect my-shared-net >/dev/null 2>&1 || docker network create my-shared-net
          for attempt in 1 2 3; do
            if docker compose pull adobe2api; then
              break
            fi
            if [ "$attempt" -eq 3 ]; then
              exit 1
            fi
            sleep $((attempt * 20))
          done
          docker tag "${IMAGE_REGISTRY}/${IMAGE_NAMESPACE}/${IMAGE_REPOSITORY}:${IMAGE_TAG}" \
            "${IMAGE_REGISTRY}/${IMAGE_NAMESPACE}/${IMAGE_REPOSITORY}:latest"
          docker compose up -d --remove-orphans adobe2api
          docker image prune -f

      - name: Verify container status
        shell: bash
        run: |
          set -euo pipefail

          cd "$DEPLOY_DIR"
          for i in $(seq 1 30); do
            status="$(docker inspect --format='{{if .State.Health}}{{.State.Health.Status}}{{else}}{{.State.Status}}{{end}}' adobe2api 2>/dev/null || true)"
            if [ "$status" = "healthy" ] || [ "$status" = "running" ]; then
              published="$(docker compose port adobe2api 6001 2>/dev/null | head -n1 || true)"
              port="${published##*:}"
              port="${port:-6001}"
              if curl -fsS "http://127.0.0.1:${port}/api/v1/health" >/dev/null; then
                exit 0
              fi
            fi
            sleep 5
          done

          docker ps -a --filter name=adobe2api
          docker logs --tail 120 adobe2api || true
          exit 1
