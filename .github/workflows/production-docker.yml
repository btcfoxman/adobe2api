name: Production Docker

on:
  push:
    branches:
      - master
  workflow_dispatch:

permissions:
  contents: read
  packages: write

concurrency:
  group: adobe2api-production
  cancel-in-progress: true

env:
  IMAGE_REGISTRY: ghcr.io
  IMAGE_NAMESPACE: btcfoxman
  IMAGE_REPOSITORY: adobe2api

jobs:
  build:
    name: Build and Push Image
    runs-on: ubuntu-latest
    outputs:
      image_tag: ${{ steps.tags.outputs.image_tag }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.IMAGE_REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build image tags
        id: tags
        shell: bash
        run: |
          IMAGE_BASE="${IMAGE_REGISTRY}/${IMAGE_NAMESPACE}/${IMAGE_REPOSITORY}"
          SHA_TAG="sha-${GITHUB_SHA::12}"

          {
            echo "image_tag=${SHA_TAG}"
            echo "value<<EOF"
            echo "${IMAGE_BASE}:${SHA_TAG}"
            echo "${IMAGE_BASE}:latest"
            echo "EOF"
          } >> "$GITHUB_OUTPUT"

      - name: Build and push Docker image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          push: true
          tags: ${{ steps.tags.outputs.value }}
          platforms: linux/amd64
          cache-from: type=gha
          cache-to: type=gha,mode=max
          provenance: false
          sbom: false

  deploy:
    name: Deploy to production server
    needs: build
    runs-on: ubuntu-latest
    environment: SSH-GCP
    steps:
      - name: Validate SSH deploy configuration
        shell: bash
        env:
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
          DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          DEPLOY_PATH: ${{ secrets.DEPLOY_PATH }}
        run: |
          test -n "$DEPLOY_HOST" || { echo "::error::DEPLOY_HOST secret is required"; exit 1; }
          test -n "$DEPLOY_USER" || { echo "::error::DEPLOY_USER secret is required"; exit 1; }
          test -n "$DEPLOY_SSH_KEY" || { echo "::error::DEPLOY_SSH_KEY secret is required"; exit 1; }
          test -n "$DEPLOY_PATH" || { echo "::error::DEPLOY_PATH secret is required"; exit 1; }

      - name: Pull image and restart service over SSH
        uses: appleboy/ssh-action@v1.0.3
        env:
          DEPLOY_PATH: ${{ secrets.DEPLOY_PATH }}
          DEPLOY_SERVICE: ${{ secrets.DEPLOY_SERVICE }}
          GHCR_USERNAME: ${{ github.actor }}
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          IMAGE_REGISTRY: ${{ env.IMAGE_REGISTRY }}
          IMAGE_NAMESPACE: ${{ env.IMAGE_NAMESPACE }}
          IMAGE_REPOSITORY: ${{ env.IMAGE_REPOSITORY }}
          IMAGE_NAME: ${{ env.IMAGE_REPOSITORY }}
          IMAGE_TAG: ${{ needs.build.outputs.image_tag }}
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          username: ${{ secrets.DEPLOY_USER }}
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          port: ${{ secrets.DEPLOY_PORT || 22 }}
          timeout: 60s
          command_timeout: 20m
          envs: DEPLOY_PATH,DEPLOY_SERVICE,GHCR_USERNAME,GHCR_TOKEN,IMAGE_REGISTRY,IMAGE_NAMESPACE,IMAGE_REPOSITORY,IMAGE_NAME,IMAGE_TAG
          script: |
            set -eu

            test -n "$DEPLOY_PATH" || { echo "DEPLOY_PATH is required"; exit 1; }
            cd "$DEPLOY_PATH"
            test -f docker-compose.yml || { echo "docker-compose.yml not found in $DEPLOY_PATH"; exit 1; }

            SERVICE="${DEPLOY_SERVICE:-adobe2api}"
            docker compose config --services | grep -Fx "$SERVICE" >/dev/null || {
              echo "service $SERVICE not found in docker-compose.yml"
              exit 1
            }

            echo "$GHCR_TOKEN" | docker login "$IMAGE_REGISTRY" -u "$GHCR_USERNAME" --password-stdin
            trap 'docker logout "$IMAGE_REGISTRY" >/dev/null 2>&1 || true' EXIT

            docker network inspect my-shared-net >/dev/null 2>&1 || docker network create my-shared-net

            IMAGE_REGISTRY="$IMAGE_REGISTRY" \
            IMAGE_NAMESPACE="$IMAGE_NAMESPACE" \
            IMAGE_REPOSITORY="$IMAGE_REPOSITORY" \
            IMAGE_NAME="$IMAGE_NAME" \
            IMAGE_TAG="$IMAGE_TAG" \
              docker compose pull "$SERVICE"

            IMAGE_REGISTRY="$IMAGE_REGISTRY" \
            IMAGE_NAMESPACE="$IMAGE_NAMESPACE" \
            IMAGE_REPOSITORY="$IMAGE_REPOSITORY" \
            IMAGE_NAME="$IMAGE_NAME" \
            IMAGE_TAG="$IMAGE_TAG" \
              docker compose up -d --no-build "$SERVICE"

            for _ in $(seq 1 30); do
              container_id="$(docker compose ps -q "$SERVICE" 2>/dev/null || true)"
              status="$(docker inspect --format='{{if .State.Health}}{{.State.Health.Status}}{{else}}{{.State.Status}}{{end}}' "$container_id" 2>/dev/null || true)"
              if [ "$status" = "healthy" ] || [ "$status" = "running" ]; then
                if docker exec "$container_id" python -c \
                  "import urllib.request; urllib.request.urlopen('http://127.0.0.1:6001/api/v1/health', timeout=3).read()" \
                  >/dev/null 2>&1; then
                  echo "adobe2api deployment is healthy"
                  exit 0
                fi
              fi
              sleep 5
            done

            docker compose ps "$SERVICE" || true
            docker compose logs --tail 120 "$SERVICE" || true
            exit 1
